services:
  rails:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000"
    command: ./bin/rails server -b 0.0.0.0
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - ./log:/rails/log
      - ./tmp:/rails/tmp
      - .:/rails
    env_file:
      - .env
    networks:
      - postgres_network
      - kafka_network

  karafka:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: bundle exec karafka server
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - KAFKA_BROKERS=kafka-broker:9092
    volumes:
      - ./log:/rails/log
      - ./tmp:/rails/tmp
      - .:/rails
    env_file:
      - .env
    networks:
      - postgres_network
      - kafka_network

networks:
  postgres_network:
    name: postgres_network
    external: true
    driver: bridge
  kafka_network:
    name: kafka_network
    external: true
    driver: bridge
